[package]
name = "devstate"
version = "0.1.0"
edition = "2024"
description = "Project-scoped development state across agents and sessions"
publish = false

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
